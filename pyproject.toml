[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ieeg-ehr"
version = "0.1.0"
description = "Sensory vs affective pain encoding in intracranial EEG (Sisler / Keller Lab)"
requires-python = ">=3.12"

# Installed editable with --no-deps against the shared venv at
# $GROUP_HOME/venvs/ieeg_ehr_analysis, so these are a declaration of what the
# code needs, not something pip is asked to resolve. Installing them
# unpinned would risk upgrading the working numpy/pandas/pynwb underneath a
# 1.9 TB derivatives tree. Add new deps explicitly, one at a time.
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pynwb",
    "pyarrow",   # 20.0.0 installed 2026-07-27 (P0.3). MUST be installed with
                 #   --only-binary=:all: — Sherlock is glibc 2.17 and modern
                 #   pyarrow wheels are manylinux_2_28, so a plain install falls
                 #   through to a source build. See docs/io_conventions.md.
    "joblib",    # 1.5.3 — fitted models / FOOOF objects, never tables
]

[project.optional-dependencies]
# Test-only; not needed by any job. `pytest tests/` from the repo root.
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
